<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车端 HMI</title><link rel="stylesheet" href="/terminal.css"><link rel="stylesheet" href="/operations.css"></head>
<body><header><div><h1>车端 HMI · <span id="title-id">T0</span></h1><p>VEHICLE STATE · TASK · CONTROL REFERENCE · ALARM</p></div><div class="selectors"><nav><a href="/">调度中心</a><a class="active" href="/vehicle.html">车端 HMI</a><a href="/shovel.html">铲端 HMI</a></nav><select id="entity-select"></select><span id="connection" class="link">正在连接</span></div></header>
<main><section id="hero" class="hero"></section><section class="panel half"><h2>本车状态 <small>REALTIME</small></h2><dl id="state-detail"></dl></section><section class="panel half"><h2>当前任务与目标 <small>LATEST TASK</small></h2><dl id="task-detail"></dl></section><section class="panel half"><h2>控制参考 <small>500 ms</small></h2><dl id="control-detail"></dl></section><section class="panel half"><h2>告警 <small>VERIFIABLE ONLY</small></h2><div id="alarms"></div></section><section class="panel full"><h2>本车可见决策链路 <small>VEHICLE PROJECTION</small></h2><div id="traces" class="empty">等待真实决策</div></section><section class="panel full"><h2>本车操作 <small>SERVER VALIDATED</small></h2><div class="terminal-form"><textarea id="terminal-message" maxlength="1000" placeholder="输入请求或异常说明"></textarea><div><button id="send-request">提交请求</button><button id="send-exception">异常上报</button><button id="confirm-task">确认当前任务</button></div><small id="terminal-result"></small></div><div id="operational-alerts"></div><div id="terminal-history"></div></section></main><script src="/session.js"></script><script src="/vehicle.js" defer></script><script src="/terminal-actions.js" defer></script></body></html>
